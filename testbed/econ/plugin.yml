name: NyrTestbedEconomy
version: '1.0'
main: com.nyr.testbed.economy.TestbedEconomyPlugin
description: In-memory Vault economy for testbed servers without a Folia-capable economy plugin. Never on a real server.
api-version: '1.20'
folia-supported: true
depend: [Vault]
commands:
  balance:
    description: Your balance.
    aliases: [bal]
  eco:
    description: eco set|give|take <player> <amount>
    permission: nyrtestbed.eco
permissions:
  nyrtestbed.eco:
    default: op
